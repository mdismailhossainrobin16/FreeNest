<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E3E8F0" />
<title>Profile</title>
<meta name="description" content="Links and apps" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- soft UI surface + light/shadow pair ---- */
    --bg:#E3E8F0;
    --sh-l:rgba(255,255,255,0.95);
    --sh-d:rgba(143,158,185,0.55);

    --raised:    9px 9px 20px var(--sh-d), -9px -9px 20px var(--sh-l);
    --raised-md: 6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
    --raised-sm: 4px 4px 9px var(--sh-d), -4px -4px 9px var(--sh-l);
    --inset:     inset 6px 6px 12px var(--sh-d), inset -6px -6px 12px var(--sh-l);
    --inset-sm:  inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l);
    --inset-xs:  inset 2px 2px 4px var(--sh-d), inset -2px -2px 4px var(--sh-l);

    /* accents are overridden from the admin panel (gradientColors) */
    --accent-a:#7C5CFC;
    --accent-b:#22D3C6;
    --accent-c:#FFB86B;

    --text-0:#2B3350;
    --text-1:#566079;
    --text-2:#6F7894;
    --on-accent:#0F1424;

    --radius-lg:26px;
    --radius-md:18px;
    --radius-pill:999px;
    --maxw:560px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100svh;
    background:var(--bg);
    color:var(--text-0);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;}

  /* ---------- soft backdrop (plain surface, optional image from admin) ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:var(--bg);
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative; z-index:2;
    max-width:var(--maxw); margin:0 auto;
    padding:56px 24px 72px;
  }

  /* ---------- hero ---------- */
  .hero{ text-align:center; }
  .avatar-ring{
    width:116px; height:116px; margin:0 auto 22px;
    border-radius:50%;
    padding:9px;
    background:var(--bg);
    box-shadow:var(--raised);
    opacity:0; transform:translateY(10px) scale(.94);
  }
  .avatar{
    width:100%; height:100%; border-radius:50%;
    background:var(--bg) center/cover no-repeat;
    box-shadow:var(--inset-sm);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:700; color:var(--text-1);
  }
  .name{
    font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;
    color:var(--text-0);
    text-shadow:1px 1px 1px var(--sh-l);
    opacity:0; transform:translateY(10px);
  }
  .bio{
    font-size:15px; line-height:1.6; color:var(--text-1); margin:0 auto; max-width:420px;
    text-shadow:1px 1px 1px var(--sh-l);
    opacity:0; transform:translateY(10px);
  }

  /* ---------- premium dust-assemble name animation ---------- */
  .name-skeleton{ display:inline-block; width:150px; height:26px; vertical-align:middle; }
  .name.name-premium{ opacity:1; transform:none; display:inline-flex; flex-wrap:wrap; justify-content:center; }
  .name-premium .letter{
    position:relative; display:inline-block;
    opacity:0; filter:blur(7px);
    transform:scale(.6) translateY(4px);
    animation: letterAssemble .6s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--i,0) * .085s + .45s);
  }
  @keyframes letterAssemble{
    to{ opacity:1; filter:blur(0); transform:scale(1) translateY(0); }
  }
  .name-premium .dust{
    position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow:0 0 4px 0 var(--accent-b);
    opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) translate(var(--dx,0), var(--dy,0)) scale(1.6);
    animation: dustConverge var(--dd,.7s) ease-out forwards;
    animation-delay: calc(var(--i,0) * .085s + var(--dl,0s));
  }
  @keyframes dustConverge{
    0%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx,0), var(--dy,0)) scale(1.6); }
    35%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(0,0) scale(.3); }
  }
  @media (prefers-reduced-motion: reduce){
    .name-premium .letter{ animation:none !important; opacity:1 !important; filter:none !important; transform:none !important; }
    .name-premium .dust{ display:none !important; }
  }

  /* stagger-in, single orchestrated entrance */
  .avatar-ring{ animation: rise .7s cubic-bezier(.2,.7,.2,1) .05s forwards; }
  .name{ animation: rise .7s cubic-bezier(.2,.7,.2,1) .16s forwards; }
  .bio{ animation: rise .7s cubic-bezier(.2,.7,.2,1) .26s forwards; }
  .social-grid{ opacity:0; animation: rise .7s cubic-bezier(.2,.7,.2,1) .38s forwards; }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1);} }
  @media (prefers-reduced-motion: reduce){
    .avatar-ring,.name,.bio,.social-grid,.app-store-btn{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ---------- App Store toggle button ---------- */
  .app-store-btn{
    display:none; align-items:center; gap:10px;
    margin:26px auto 0; padding:14px 26px;
    border-radius:var(--radius-pill);
    background:var(--bg); border:none;
    box-shadow:var(--raised-md);
    color:var(--text-0); font-weight:600; font-size:14px; font-family:inherit; cursor:pointer;
    position:relative;
    opacity:0; transform:translateY(8px);
    transition: box-shadow .25s ease, opacity .4s ease, transform .4s ease, color .25s ease;
  }
  .app-store-btn.show{ opacity:1; transform:translateY(0); }
  .app-store-btn:hover{ box-shadow:8px 8px 18px var(--sh-d), -8px -8px 18px var(--sh-l); }
  .app-store-btn:active,
  .app-store-btn.open{ box-shadow:var(--inset-sm); }
  .app-store-btn svg{ width:17px; height:17px; flex:none; color:var(--accent-a); }
  .app-store-btn .chev{ width:13px; height:13px; transition: transform .32s cubic-bezier(.2,.8,.3,1); color:var(--text-2); }
  .app-store-btn.open .chev{ transform:rotate(180deg); color:var(--text-0); }

  /* ---------- social links (long rows) ---------- */
  .social-grid{
    display:flex; flex-direction:column; gap:20px;
    margin:34px 0 6px;
  }
  .social-btn{
    display:flex; align-items:center; gap:16px;
    width:100%; padding:14px 18px; border-radius:22px;
    background:var(--bg); border:none;
    box-shadow:var(--raised-md);
    color:var(--text-0); text-decoration:none;
    position:relative;
    transition: box-shadow .25s ease, color .25s ease;
  }
  .social-icon{
    width:46px; height:46px; border-radius:15px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    box-shadow:var(--inset-sm);
    color:var(--accent-a);
    transition: color .25s ease;
  }
  .social-icon:has(img){ padding:4px; }
  .social-icon svg{ width:21px; height:21px; }
  .social-label{ font-weight:600; font-size:14.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .social-arrow{ width:18px; height:18px; flex:none; color:var(--text-2); transition: transform .28s cubic-bezier(.2,.8,.3,1), color .28s ease; }
  .social-btn:hover, .social-btn:focus-visible{
    box-shadow:8px 8px 18px var(--sh-d), -8px -8px 18px var(--sh-l);
  }
  .social-btn:hover .social-icon{ color:var(--accent-b); }
  .social-btn:hover .social-arrow{ transform:translate(3px,-3px); color:var(--text-0); }
  .social-btn:active{ box-shadow:var(--inset-sm); }
  .social-btn:active .social-arrow{ transform:none; }
  .social-btn{
    opacity:0; transform:translateX(-14px) scale(.97);
    animation: linkIn .6s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: var(--i-delay, 0s);
  }
  @keyframes linkIn{ to{ opacity:1; transform:translateX(0) scale(1);} }
  @media (prefers-reduced-motion: reduce){
    .social-btn{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ---------- apps reveal (swaps in place of social links) ---------- */
  #appsSection{ display:none; }
  .swap-out{ animation: swapOut .3s cubic-bezier(.4,0,.6,1) forwards; }
  .swap-in{ animation: swapIn .42s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes swapOut{ to{ opacity:0; transform:translateY(-10px) scale(.98); } }
  @keyframes swapIn{ from{ opacity:0; transform:translateY(14px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  @media (prefers-reduced-motion: reduce){
    .swap-out, .swap-in{ animation:none !important; opacity:1 !important; transform:none !important; }
  }

  /* ---------- section heading ---------- */
  .section-title{
    font-size:13px; font-weight:600; color:var(--text-2); margin:44px 2px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .section-title::after{ content:""; flex:1; height:6px; border-radius:var(--radius-pill); background:var(--bg); box-shadow:var(--inset-xs); }

  /* ---------- app cards ---------- */
  .apps{ display:flex; flex-direction:column; gap:26px; }
  .app-card{
    background:var(--bg);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--raised);
  }
  .app-top{ display:flex; gap:14px; align-items:flex-start; }
  .app-icon{
    width:60px; height:60px; border-radius:19px; flex:none;
    background:var(--bg) center/cover no-repeat;
    box-shadow:var(--inset-sm);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:var(--text-1);
  }
  .app-info{ min-width:0; flex:1; }
  .app-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .app-name{ font-size:16px; font-weight:700; margin:0; color:var(--text-0); }
  .app-version{
    font-size:11px; font-weight:700;
    color:color-mix(in srgb, var(--accent-a) 70%, var(--on-accent));
    background:var(--bg); box-shadow:var(--inset-xs);
    padding:4px 11px; border-radius:var(--radius-pill); flex:none;
  }
  .app-desc{ font-size:13.5px; color:var(--text-1); margin:5px 0 0; line-height:1.55; }
  .app-shot{
    margin-top:16px; width:100%; display:block;
    padding:6px; border-radius:20px;
    background:var(--bg); box-shadow:var(--inset-sm);
  }
  .app-actions{ margin-top:18px; }
  .dl-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px 16px; border-radius:var(--radius-pill);
    background:linear-gradient(120deg, var(--accent-a), var(--accent-b));
    color:var(--on-accent); font-weight:700; font-size:14px; text-decoration:none;
    box-shadow:var(--raised-md);
    transition: box-shadow .2s ease, filter .2s ease;
  }
  .dl-btn:hover{ filter:brightness(1.05); }
  .dl-btn:active{ box-shadow:inset 3px 3px 8px rgba(0,0,0,.28), inset -3px -3px 8px rgba(255,255,255,.3); }
  .dl-btn svg{ width:16px; height:16px; }

  .empty{
    text-align:center; color:var(--text-2); font-size:13.5px;
    padding:28px 10px; border-radius:var(--radius-md);
    background:var(--bg); box-shadow:var(--inset-sm);
  }

  footer{
    text-align:center; margin-top:56px; color:var(--text-2); font-size:12px;
  }
  footer a{ color:var(--text-1); text-decoration:none; font-weight:600; }

  .skeleton{
    background:linear-gradient(90deg, rgba(143,158,185,.16) 25%, rgba(255,255,255,.6) 37%, rgba(143,158,185,.16) 63%);
    background-size:400% 100%;
    box-shadow:var(--inset-sm);
    animation: shimmer 1.4s ease infinite;
    border-radius:var(--radius-md);
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }
  @media (prefers-reduced-motion: reduce){ .skeleton{ animation:none; } }

  :focus-visible{ outline:2px solid var(--accent-a); outline-offset:3px; }
</style>
</head>
<body>

<div class="backdrop"></div>

<div class="wrap">
  <div class="hero">
    <div class="avatar-ring"><div class="avatar" id="avatar">?</div></div>
    <h1 class="name" id="name"><span class="skeleton name-skeleton"></span></h1>
    <p class="bio" id="bio"></p>
    <button class="app-store-btn" id="appStoreBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><path d="M8 14h3"/></svg>
      <span class="app-store-label">App Store</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <div class="social-grid" id="socialGrid"></div>

  <div id="appsSection">
    <div class="section-title">Apps</div>
    <div class="apps" id="appsGrid">
      <div class="skeleton" style="height:96px;"></div>
      <div class="skeleton" style="height:96px;"></div>
    </div>
  </div>

  <footer>Developer<a href="#" id="footerLink"> ROBIN</a></footer>
</div>

<!-- Firebase (modular, CDN) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, collection, getDocs, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ======================================================================
  // 1) PASTE YOUR FIREBASE CONFIG HERE (same project as admin.html)
  // ======================================================================
  const firebaseConfig = {
  apiKey: "AIzaSyDKBSwz4gpK_a22C48LFupIIPTkPF0BvL8",
  authDomain: "my-link-7b5df.firebaseapp.com",
  databaseURL: "https://my-link-7b5df-default-rtdb.firebaseio.com",
  projectId: "my-link-7b5df",
  storageBucket: "my-link-7b5df.firebasestorage.app",
  messagingSenderId: "367902503094",
  appId: "1:367902503094:web:77f7c1b13ce4d366aab617",
  measurementId: "G-XVSLBKYT2Z"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------- icon set ----------
  const ICONS = {
    facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.4h2.8l.4-3.3h-3.2V8.2c0-.95.27-1.6 1.63-1.6h1.74V3.7C15.97 3.6 15 3.5 13.9 3.5c-2.9 0-4.9 1.77-4.9 5v2.8H6.2v3.3H9v8.4h4.5Z"/></svg>`,
    instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.1" cy="6.9" r="1.1" fill="currentColor" stroke="none"/></svg>`,
    tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3h2.7c.2 1.9 1.6 3.4 3.5 3.7v2.8c-1.3 0-2.5-.4-3.5-1.1v6.4c0 3-2.4 5.4-5.4 5.4S6.4 17.8 6.4 14.8c0-2.9 2.3-5.3 5.2-5.4v2.9c-1.3.1-2.4 1.2-2.4 2.5 0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5V3Z"/></svg>`,
    youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.8c-.2-1.2-1.1-2.1-2.3-2.3C17.4 5.2 12 5.2 12 5.2s-5.4 0-7.3.3C3.5 5.7 2.6 6.6 2.4 7.8 2.1 9.7 2.1 12 2.1 12s0 2.3.3 4.2c.2 1.2 1.1 2.1 2.3 2.3 1.9.3 7.3.3 7.3.3s5.4 0 7.3-.3c1.2-.2 2.1-1.1 2.3-2.3.3-1.9.3-4.2.3-4.2s0-2.3-.3-4.2ZM10 15.2V8.8l5.5 3.2-5.5 3.2Z"/></svg>`,
    telegram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 4.4 2.9 11.7c-.9.35-.9.98-.15 1.24l4.6 1.44 1.78 5.5c.22.6.56.6.87.36l2.5-2.3 4.55 3.36c.5.32 1.02.13 1.18-.5l3.47-16.1c.25-.94-.35-1.35-1.05-1.06Zm-3.2 3.2-8.1 7.35-.32 3.1-1.6-4.95 9.66-6.13c.35-.2.65.05.36.63Z"/></svg>`,
    whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.8-.9-2.1-1-.3-.1-.5-.15-.7.15-.2.3-.8 1-.95 1.2-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.4-1.47-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.6.14-.14.3-.35.45-.53.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.7-1.68-.96-2.3-.25-.6-.5-.5-.7-.5h-.6c-.2 0-.53.07-.8.37-.28.3-1.05 1.02-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.13 3.25 5.15 4.55.72.31 1.28.5 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.8-.73 2.05-1.44.25-.7.25-1.3.17-1.44-.07-.13-.27-.2-.57-.35ZM12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.15L2 22l4.98-1.44A9.96 9.96 0 0 0 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2Z"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 7.5 12.4 6a3.5 3.5 0 1 1 5 5l-1.5 1.4"/><path d="M13 16.5 11.6 18a3.5 3.5 0 1 1-5-5l1.5-1.4"/></svg>`
  };
  const iconFor = key => ICONS[(key||"").toLowerCase()] || ICONS.link;

  const dlIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`;

  const initials = name => (name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("") || "?";

  function renderPremiumName(el, name){
    el.innerHTML = "";
    el.classList.add("name-premium");
    Array.from(name).forEach((ch, i) => {
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.style.setProperty("--i", i);
      letter.textContent = ch === " " ? "\u00A0" : ch;
      if(ch !== " "){
        const dustCount = 5;
        for(let d = 0; d < dustCount; d++){
          const dot = document.createElement("i");
          dot.className = "dust";
          const angle = Math.random() * Math.PI * 2;
          const dist = 16 + Math.random() * 26;
          const dx = (Math.cos(angle) * dist).toFixed(1) + "px";
          const dy = (Math.sin(angle) * dist).toFixed(1) + "px";
          dot.style.setProperty("--dx", dx);
          dot.style.setProperty("--dy", dy);
          dot.style.setProperty("--dd", (0.55 + Math.random() * 0.35).toFixed(2) + "s");
          dot.style.setProperty("--dl", (Math.random() * 0.12).toFixed(2) + "s");
          dot.style.setProperty("--i", i);
          letter.appendChild(dot);
        }
      }
      el.appendChild(letter);
    });
  }

  async function loadProfile(){
    try{
      const snap = await getDoc(doc(db, "profile", "main"));
      const p = snap.exists() ? snap.data() : {};
      document.title = p.name || "Profile";
      renderPremiumName(document.getElementById("name"), p.name || "Your Name");
      document.getElementById("bio").textContent = p.bio || "";
      const avatar = document.getElementById("avatar");
      if(p.avatarUrl){
        avatar.style.backgroundImage = `url(${JSON.stringify(p.avatarUrl).slice(1,-1)})`;
        avatar.textContent = "";
      } else {
        avatar.textContent = initials(p.name);
      }
      applyAppearance(p);
    }catch(e){
      document.getElementById("name").textContent = "Your Name";
      console.error(e);
    }
  }

  function applyAppearance(p){
    const root = document.documentElement.style;
    if(Array.isArray(p.gradientColors) && p.gradientColors.length >= 2){
      root.setProperty("--accent-a", p.gradientColors[0]);
      root.setProperty("--accent-b", p.gradientColors[1]);
      if(p.gradientColors[2]) root.setProperty("--accent-c", p.gradientColors[2]);
    }
    const bd = document.querySelector(".backdrop");
    if(p.backgroundType === "image" && p.bgImageUrl){
      bd.style.backgroundImage = `linear-gradient(rgba(227,232,240,.78),rgba(227,232,240,.9)), url(${JSON.stringify(p.bgImageUrl).slice(1,-1)})`;
      bd.style.backgroundSize = "cover";
      bd.style.backgroundPosition = "center";
    }
  }

  async function loadLinks(){
    const grid = document.getElementById("socialGrid");
    try{
      const q = query(collection(db, "links"), orderBy("order", "asc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach(d => { const v = d.data(); if(v.enabled !== false) items.push(v); });
      grid.innerHTML = items.map((l, idx) => `
        <a class="social-btn" style="--i-delay:${(idx*0.07).toFixed(2)}s" href="${escAttr(l.url||'#')}" target="_blank" rel="noopener noreferrer">
          <span class="social-icon">${l.iconUrl ? `<img src="${escAttr(l.iconUrl)}" alt="" style="width:100%;height:100%;border-radius:13px;object-fit:cover;">` : iconFor(l.platform)}</span>
          <span class="social-label">${escHtml(l.label || l.platform || 'Link')}</span>
          <svg class="social-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>
      `).join("");
    }catch(e){ console.error(e); }
  }

  async function loadApps(){
    const wrap = document.getElementById("appsGrid");
    const btn = document.getElementById("appStoreBtn");
    try{
      const q = query(collection(db, "apps"), orderBy("order", "asc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach(d => { const v = d.data(); if(v.enabled !== false) items.push(v); });

      if(items.length === 0){ return; }

      btn.style.display = "inline-flex";
      requestAnimationFrame(() => btn.classList.add("show"));

      wrap.innerHTML = items.map(a => `
        <div class="app-card">
          <div class="app-top">
            <div class="app-icon" ${a.iconUrl ? `style="background-image:url(${JSON.stringify(a.iconUrl).slice(1,-1)})"` : ""}>
              ${a.iconUrl ? "" : initials(a.name)}
            </div>
            <div class="app-info">
              <div class="app-name-row">
                <p class="app-name">${escHtml(a.name || "App")}</p>
                ${a.version ? `<span class="app-version">v${escHtml(a.version)}</span>` : ""}
              </div>
              <p class="app-desc">${escHtml(a.description || "")}</p>
            </div>
          </div>
          ${a.screenshotUrl ? `<img class="app-shot" src="${escAttr(a.screenshotUrl)}" alt="${escAttr((a.name||'App') + ' screenshot')}">` : ""}
          <div class="app-actions">
            <a class="dl-btn" href="${escAttr(a.downloadUrl || '#')}" target="_blank" rel="noopener noreferrer">${dlIcon} Download</a>
          </div>
        </div>
      `).join("");
    }catch(e){
      wrap.innerHTML = `<div class="empty">Apps will appear here.</div>`;
      console.error(e);
    }
  }

  function escHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escAttr(s){ return escHtml(s); }

  document.getElementById("appStoreBtn").addEventListener("click", () => {
    const btn = document.getElementById("appStoreBtn");
    const label = btn.querySelector(".app-store-label");
    const socialGrid = document.getElementById("socialGrid");
    const appsSection = document.getElementById("appsSection");
    const opening = !btn.classList.contains("open");

    if(opening){
      btn.classList.add("open");
      label.textContent = "Back to Links";
      socialGrid.classList.remove("swap-in");
      socialGrid.classList.add("swap-out");
      setTimeout(() => {
        socialGrid.style.display = "none";
        appsSection.style.display = "block";
        appsSection.classList.remove("swap-out");
        void appsSection.offsetWidth;
        appsSection.classList.add("swap-in");
      }, 280);
    } else {
      btn.classList.remove("open");
      label.textContent = "App Store";
      appsSection.classList.remove("swap-in");
      appsSection.classList.add("swap-out");
      setTimeout(() => {
        appsSection.style.display = "none";
        appsSection.classList.remove("swap-out");
        socialGrid.style.display = "flex";
        socialGrid.classList.remove("swap-out");
        void socialGrid.offsetWidth;
        socialGrid.classList.add("swap-in");
      }, 280);
    }
  });

  loadProfile();
  loadLinks();
  loadApps();
</script>
</body>
</html>
