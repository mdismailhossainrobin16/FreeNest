<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E3E8F0" />
<title>Profile</title>
<meta name="description" content="Links and more" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- soft UI surface + light/shadow pair ---- */
    --bg:#E3E8F0;
    --sh-l:rgba(255,255,255,0.95);
    --sh-d:rgba(143,158,185,0.55);

    --raised:    9px 9px 20px var(--sh-d), -9px -9px 20px var(--sh-l);
    --raised-md: 6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
    --raised-sm: 4px 4px 9px var(--sh-d), -4px -4px 9px var(--sh-l);
    --inset:     inset 6px 6px 12px var(--sh-d), inset -6px -6px 12px var(--sh-l);
    --inset-sm:  inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l);
    --inset-xs:  inset 2px 2px 4px var(--sh-d), inset -2px -2px 4px var(--sh-l);

    /* accents are overridden from the admin panel (gradientColors) */
    --accent-a:#7C5CFC;
    --accent-b:#22D3C6;
    --accent-c:#FFB86B;

    /* social button colour: soft turquoise teal (admin can override: socialColor) */
    --social:#39B1AA;
    --on-social:#06302D;

    --text-0:#2B3350;
    --text-1:#566079;
    --text-2:#6F7894;
    --on-accent:#0F1424;

    --radius-lg:26px;
    --radius-md:18px;
    --radius-pill:999px;
    --maxw:560px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100svh;
    background:var(--bg);
    color:var(--text-0);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;}

  /* =====================================================================
     LIVE MOTION LIBRARY  (transform-free "translate / rotate / scale"
     properties are used so floating never fights entrance animations)
     ===================================================================== */
  @keyframes floatY{ 0%,100%{ translate:0 0; } 50%{ translate:0 var(--amp,-6px); } }
  @keyframes floatSway{ 0%,100%{ translate:0 0; rotate:0deg; } 50%{ translate:0 -9px; rotate:1.4deg; } }
  @keyframes sheen{ 0%,62%{ transform:translateX(-130%) skewX(-18deg); } 100%{ transform:translateX(130%) skewX(-18deg); } }
  @keyframes ringPulse{ 0%{ transform:scale(.96); opacity:.55; } 100%{ transform:scale(1.42); opacity:0; } }
  @keyframes iconBreath{ 0%,100%{ scale:1; } 50%{ scale:1.08; } }
  @keyframes arrowNudge{ 0%,100%{ translate:0 0; } 50%{ translate:2px -2px; } }
  @keyframes letterWave{ 0%,100%{ translate:0 0; } 50%{ translate:0 -4px; } }
  @keyframes blobDrift{
    0%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(42px,-30px,0) scale(1.12); }
    100%{ transform:translate3d(-30px,26px,0) scale(.95); }
  }
  @keyframes bubbleRise{
    0%{ transform:translate3d(0,0,0) scale(.6); opacity:0; }
    12%{ opacity:.95; }
    50%{ transform:translate3d(calc(var(--sx) * -.7), -58vh, 0) scale(.9); }
    88%{ opacity:.75; }
    100%{ transform:translate3d(var(--sx), -118vh, 0) scale(1); opacity:0; }
  }
  @keyframes ripple{ to{ transform:scale(1); opacity:0; } }
  @keyframes glowPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ---------- soft backdrop (plain surface, optional image from admin) ---------- */
  .backdrop{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:var(--bg);
  }
  .blob{
    position:absolute; border-radius:50%; will-change:transform;
    width:min(46vmax,520px); height:min(46vmax,520px);
    animation: blobDrift 16s ease-in-out infinite alternate;
  }
  .blob.b1{ top:-12%; left:-18%;
    background:radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--social) 40%, transparent), transparent 68%); }
  .blob.b2{ bottom:-14%; right:-20%; animation-duration:21s; animation-delay:-6s;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent-a) 24%, transparent), transparent 68%); }
  .blob.b3{ top:38%; left:52%; width:min(30vmax,340px); height:min(30vmax,340px); animation-duration:25s; animation-delay:-11s;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent-c) 22%, transparent), transparent 68%); }

  .bubbles{ position:absolute; inset:0; }
  .bubble{
    position:absolute; bottom:-80px; left:var(--x);
    width:var(--s); height:var(--s); border-radius:50%;
    background:var(--bg);
    box-shadow:4px 4px 9px var(--sh-d), -4px -4px 9px var(--sh-l);
    opacity:0; will-change:transform;
    animation: bubbleRise var(--t) linear var(--d) infinite;
  }
  .bubble.teal{
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), color-mix(in srgb, var(--social) 55%, transparent) 70%);
    box-shadow:2px 2px 8px color-mix(in srgb, var(--social) 35%, transparent), -3px -3px 7px var(--sh-l);
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative; z-index:2;
    max-width:var(--maxw); margin:0 auto;
    padding:56px 24px 72px;
  }

  /* ---------- hero ---------- */
  .hero{ text-align:center; }
  .avatar-ring{
    position:relative;
    width:116px; height:116px; margin:0 auto 22px;
    border-radius:50%;
    padding:9px;
    background:var(--bg);
    box-shadow:var(--raised);
    opacity:0; transform:translateY(10px) scale(.94);
    animation:
      rise .7s cubic-bezier(.2,.7,.2,1) .05s forwards,
      floatSway 6.5s ease-in-out .9s infinite;
  }
  .avatar-ring::before,
  .avatar-ring::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--social); opacity:0; pointer-events:none;
    animation: ringPulse 3.6s ease-out 1s infinite;
  }
  .avatar-ring::after{ animation-delay:2.8s; }
  .avatar{
    width:100%; height:100%; border-radius:50%;
    background:var(--bg) center/cover no-repeat;
    box-shadow:var(--inset-sm);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:700; color:var(--text-1);
  }
  .name{
    font-size:26px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;
    color:var(--text-0);
    text-shadow:1px 1px 1px var(--sh-l);
    opacity:0; transform:translateY(10px);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) .16s forwards;
  }
  .bio{
    font-size:15px; line-height:1.6; color:var(--text-1); margin:0 auto; max-width:420px;
    text-shadow:1px 1px 1px var(--sh-l);
    opacity:0; transform:translateY(10px);
    animation:
      rise .7s cubic-bezier(.2,.7,.2,1) .26s forwards,
      floatY 7s ease-in-out 1.3s infinite;
    --amp:-3px;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1);} }

  /* ---------- premium dust-assemble name animation + live wave ---------- */
  .name-skeleton{ display:inline-block; width:150px; height:26px; vertical-align:middle; }
  .name.name-premium{ opacity:1; transform:none; display:inline-flex; flex-wrap:wrap; justify-content:center; }
  .name-premium .letter{
    position:relative; display:inline-block;
    opacity:0; filter:blur(7px);
    transform:scale(.6) translateY(4px);
    animation:
      letterAssemble .6s cubic-bezier(.2,.8,.2,1) forwards,
      letterWave 3.4s ease-in-out infinite;
    animation-delay:
      calc(var(--i,0) * .085s + .45s),
      calc(var(--i,0) * .14s + 2.4s);
  }
  @keyframes letterAssemble{
    to{ opacity:1; filter:blur(0); transform:scale(1) translateY(0); }
  }
  .name-premium .dust{
    position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%;
    background:linear-gradient(135deg, var(--social), var(--accent-b));
    box-shadow:0 0 4px 0 var(--social);
    opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) translate(var(--dx,0), var(--dy,0)) scale(1.6);
    animation: dustConverge var(--dd,.7s) ease-out forwards;
    animation-delay: calc(var(--i,0) * .085s + var(--dl,0s));
  }
  @keyframes dustConverge{
    0%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx,0), var(--dy,0)) scale(1.6); }
    35%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(0,0) scale(.3); }
  }

  .social-grid{ opacity:0; animation: rise .7s cubic-bezier(.2,.7,.2,1) .38s forwards; }

  /* ---------- "More" toggle button ---------- */
  .app-store-btn{
    display:none; align-items:center; gap:10px;
    margin:26px auto 0; padding:14px 28px;
    border-radius:var(--radius-pill);
    background:var(--bg); border:none;
    box-shadow:var(--raised-md);
    color:var(--text-0); font-weight:700; font-size:14px; font-family:inherit; cursor:pointer;
    position:relative;
    opacity:0; transform:translateY(8px);
    transition: box-shadow .25s ease, opacity .4s ease, transform .4s ease, color .25s ease, scale .25s ease;
    animation: floatY 5.2s ease-in-out infinite;
  }
  .app-store-btn::before{
    content:""; position:absolute; inset:0; border-radius:inherit;
    border:2px solid var(--social); opacity:0; pointer-events:none;
    animation: ringPulse 2.8s ease-out infinite;
  }
  .app-store-btn.open::before{ display:none; }
  .app-store-btn.show{ opacity:1; transform:translateY(0); }
  .app-store-btn:hover{ box-shadow:8px 8px 18px var(--sh-d), -8px -8px 18px var(--sh-l); scale:1.04; }
  .app-store-btn:active,
  .app-store-btn.open{ box-shadow:var(--inset-sm); }
  .app-store-btn svg{ width:17px; height:17px; flex:none; color:var(--social); }
  .app-store-btn .chev{ width:13px; height:13px; transition: transform .32s cubic-bezier(.2,.8,.3,1); color:var(--text-2); }
  .app-store-btn.open .chev{ transform:rotate(180deg); color:var(--text-0); }

  /* ---------- social links (long rows, soft turquoise teal) ---------- */
  .social-grid{
    display:flex; flex-direction:column; gap:20px;
    margin:34px 0 6px;
  }
  .social-btn{
    display:flex; align-items:center; gap:16px;
    width:100%; padding:14px 18px; border-radius:22px;
    background:linear-gradient(145deg,
      color-mix(in srgb, var(--social) 84%, #fff),
      var(--social) 58%,
      color-mix(in srgb, var(--social) 92%, #000));
    border:none;
    box-shadow:var(--raised-md), inset 1px 1px 1px rgba(255,255,255,.45);
    color:var(--on-social); text-decoration:none;
    position:relative; overflow:hidden; isolation:isolate;
    transition: box-shadow .25s ease, scale .25s ease;
    opacity:0; transform:translateX(-14px) scale(.97);
    animation:
      linkIn .6s cubic-bezier(.2,.8,.2,1) var(--i-delay,0s) forwards,
      floatY var(--fs,5.6s) ease-in-out calc(var(--i-delay,0s) + .7s) infinite;
  }
  .social-btn:nth-child(even){ --fs:6.3s; --amp:-5px; }
  .social-btn:nth-child(3n){ --fs:5.1s; --amp:-7px; }
  .social-btn::after{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(110deg, transparent 32%, rgba(255,255,255,.42) 50%, transparent 68%);
    transform:translateX(-130%) skewX(-18deg);
    animation: sheen 5.5s ease-in-out calc(var(--i-delay,0s) + 1.8s) infinite;
  }
  @keyframes linkIn{ to{ opacity:1; transform:translateX(0) scale(1);} }
  .social-icon{
    width:46px; height:46px; border-radius:15px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--social) 78%, #fff);
    box-shadow:inset 3px 3px 7px rgba(6,70,65,.30), inset -3px -3px 7px rgba(255,255,255,.45);
    color:var(--on-social);
    transition: rotate .3s cubic-bezier(.2,.8,.3,1);
    animation: iconBreath 3.4s ease-in-out var(--i-delay,0s) infinite;
  }
  .social-icon:has(img){ padding:4px; }
  .social-icon svg{ width:21px; height:21px; }
  .social-label{ font-weight:700; font-size:14.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .social-arrow{
    width:18px; height:18px; flex:none; color:var(--on-social); opacity:.78;
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s ease;
    animation: arrowNudge 2.4s ease-in-out var(--i-delay,0s) infinite;
  }
  .social-btn:hover, .social-btn:focus-visible{
    box-shadow:8px 8px 18px var(--sh-d), -8px -8px 18px var(--sh-l), inset 1px 1px 1px rgba(255,255,255,.5);
    scale:1.015;
  }
  .social-btn:hover .social-icon{ rotate:-8deg; }
  .social-btn:hover .social-arrow{ transform:translate(3px,-3px); opacity:1; }
  .social-btn:active{ box-shadow:inset 4px 4px 10px rgba(6,70,65,.38), inset -3px -3px 8px rgba(255,255,255,.3); scale:.99; }
  .social-btn:active .social-arrow{ transform:none; }

  .ripple{
    position:absolute; border-radius:50%; pointer-events:none; z-index:0;
    background:rgba(255,255,255,.55); transform:scale(0);
    animation: ripple .65s ease-out forwards;
  }

  /* ---------- "More" reveal (swaps in place of social links) ---------- */
  #appsSection{ display:none; }
  .swap-out{ animation: swapOut .3s cubic-bezier(.4,0,.6,1) forwards; }
  .swap-in{ animation: swapIn .42s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes swapOut{ to{ opacity:0; transform:translateY(-10px) scale(.98); } }
  @keyframes swapIn{ from{ opacity:0; transform:translateY(14px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }

  /* ---------- section heading ---------- */
  .section-title{
    font-size:13px; font-weight:600; color:var(--text-2); margin:44px 2px 20px;
    display:flex; align-items:center; gap:14px;
  }
  .section-title::after{
    content:""; flex:1; height:6px; border-radius:var(--radius-pill);
    background:var(--bg); box-shadow:var(--inset-xs);
    animation: glowPulse 3s ease-in-out infinite;
  }

  /* ---------- more-link cards ---------- */
  .apps{ display:flex; flex-direction:column; gap:26px; }
  .app-card{
    background:var(--bg);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--raised);
    opacity:0;
    animation:
      cardIn .6s cubic-bezier(.2,.8,.2,1) var(--i-delay,0s) forwards,
      floatY 7s ease-in-out calc(var(--i-delay,0s) + .8s) infinite;
    --amp:-5px;
  }
  .app-card:nth-child(even){ --amp:-7px; animation-duration:.6s, 8s; }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(18px) scale(.97);} to{ opacity:1; transform:none;} }
  .app-top{ display:flex; gap:14px; align-items:flex-start; }
  .app-icon{
    width:60px; height:60px; border-radius:19px; flex:none;
    background:var(--bg) center/cover no-repeat;
    box-shadow:var(--inset-sm);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; color:color-mix(in srgb, var(--social) 78%, #000);
    animation: floatY 4.6s ease-in-out infinite; --amp:-3px;
  }
  .app-icon svg{ width:26px; height:26px; }
  .app-info{ min-width:0; flex:1; }
  .app-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .app-name{ font-size:16px; font-weight:700; margin:0; color:var(--text-0); overflow-wrap:anywhere; }
  .app-version{
    font-size:11px; font-weight:700;
    color:color-mix(in srgb, var(--social) 70%, #000);
    background:var(--bg); box-shadow:var(--inset-xs);
    padding:4px 11px; border-radius:var(--radius-pill); flex:none;
  }
  .app-desc{ font-size:13.5px; color:var(--text-1); margin:5px 0 0; line-height:1.55; overflow-wrap:anywhere; }
  .app-shot{
    margin-top:16px; width:100%; display:block;
    padding:6px; border-radius:20px;
    background:var(--bg); box-shadow:var(--inset-sm);
  }
  .app-actions{ margin-top:18px; }
  .dl-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px 16px; border-radius:var(--radius-pill);
    background:linear-gradient(120deg, var(--social), color-mix(in srgb, var(--social) 72%, #fff));
    color:var(--on-social); font-weight:700; font-size:14px; text-decoration:none;
    box-shadow:var(--raised-md), inset 1px 1px 1px rgba(255,255,255,.45);
    position:relative; overflow:hidden; isolation:isolate;
    transition: box-shadow .2s ease, filter .2s ease, scale .2s ease;
  }
  .dl-btn::after{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(110deg, transparent 32%, rgba(255,255,255,.45) 50%, transparent 68%);
    transform:translateX(-130%) skewX(-18deg);
    animation: sheen 4.8s ease-in-out 1.2s infinite;
  }
  .dl-btn:hover{ filter:brightness(1.04); scale:1.02; }
  .dl-btn:active{ box-shadow:inset 3px 3px 8px rgba(6,70,65,.35), inset -3px -3px 8px rgba(255,255,255,.3); scale:.99; }
  .dl-btn svg{ width:16px; height:16px; }

  .empty{
    text-align:center; color:var(--text-2); font-size:13.5px;
    padding:28px 10px; border-radius:var(--radius-md);
    background:var(--bg); box-shadow:var(--inset-sm);
  }

  footer{
    text-align:center; margin-top:56px; color:var(--text-2); font-size:12px;
  }
  footer a{
    color:var(--text-1); text-decoration:none; font-weight:600;
    display:inline-block; animation: floatY 4s ease-in-out infinite; --amp:-3px;
  }

  .skeleton{
    background:linear-gradient(90deg, rgba(143,158,185,.16) 25%, rgba(255,255,255,.6) 37%, rgba(143,158,185,.16) 63%);
    background-size:400% 100%;
    box-shadow:var(--inset-sm);
    animation: shimmer 1.4s ease infinite;
    border-radius:var(--radius-md);
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  :focus-visible{ outline:2px solid var(--social); outline-offset:3px; }

  /* ---------- respect reduced-motion: everything shows, nothing moves ---------- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition-duration:.01ms !important; }
    .avatar-ring,.name,.bio,.social-grid,.social-btn,.app-card{ opacity:1 !important; transform:none !important; }
    .app-store-btn.show{ opacity:1; transform:none; }
    .name-premium .letter{ opacity:1 !important; filter:none !important; transform:none !important; }
    .name-premium .dust,.bubbles,.blob,.ripple{ display:none !important; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <div class="bubbles" id="bubbles"></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="avatar-ring"><div class="avatar" id="avatar">?</div></div>
    <h1 class="name" id="name"><span class="skeleton name-skeleton"></span></h1>
    <p class="bio" id="bio"></p>
    <button class="app-store-btn" id="appStoreBtn" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg>
      <span class="app-store-label">More</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <div class="social-grid" id="socialGrid"></div>

  <div id="appsSection">
    <div class="section-title">More links</div>
    <div class="apps" id="appsGrid">
      <div class="skeleton" style="height:96px;"></div>
      <div class="skeleton" style="height:96px;"></div>
    </div>
  </div>

  <footer>Developer<a href="#" id="footerLink"> ROBIN</a></footer>
</div>

<!-- Firebase (modular, CDN) -->
<script type="module">

  import {
    getFirestore, doc, getDoc, collection, getDocs, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ======================================================================
  // 1) FIREBASE CONFIG (same project as admin.html)
  // ======================================================================
  const firebaseConfig = {
  apiKey: "AIzaSyDKBSwz4gpK_a22C48LFupIIPTkPF0BvL8",
  authDomain: "my-link-7b5df.firebaseapp.com",
  databaseURL: "https://my-link-7b5df-default-rtdb.firebaseio.com",
  projectId: "my-link-7b5df",
  storageBucket: "my-link-7b5df.firebasestorage.app",
  messagingSenderId: "367902503094",
  appId: "1:367902503094:web:77f7c1b13ce4d366aab617",
  measurementId: "G-XVSLBKYT2Z"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------- floating bubbles (live background) ----------
  (function makeBubbles(){
    const box = document.getElementById("bubbles");
    if(!box || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const rnd = (a, b) => a + Math.random() * (b - a);
    for(let i = 0; i < 14; i++){
      const b = document.createElement("span");
      b.className = "bubble" + (i % 3 === 0 ? " teal" : "");
      b.style.setProperty("--x", rnd(2, 96).toFixed(1) + "%");
      b.style.setProperty("--s", rnd(14, 46).toFixed(0) + "px");
      b.style.setProperty("--t", rnd(15, 30).toFixed(1) + "s");
      b.style.setProperty("--d", "-" + rnd(0, 22).toFixed(1) + "s");
      b.style.setProperty("--sx", rnd(-50, 50).toFixed(0) + "px");
      box.appendChild(b);
    }
  })();

  // ---------- helpers ----------
  function escHtml(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const escAttr = escHtml;

  // only http(s), mailto and tel links are allowed; bare domains get https://
  function safeUrl(u){
    let s = String(u || "").trim();
    if(!s) return "#";
    if(!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = "https://" + s;
    try{
      const p = new URL(s).protocol;
      return ["http:","https:","mailto:","tel:"].includes(p) ? s : "#";
    }catch(e){ return "#"; }
  }
  const isWeb = u => /^https?:/i.test(u);
  function safeImg(u){
    const s = String(u || "").trim();
    return (/^https?:\/\//i.test(s) || /^data:image\//i.test(s)) ? s : "";
  }
  const cssUrl = u => `url("${u.replace(/"/g, "%22")}")`;
  function applyBgImages(root){
    root.querySelectorAll("[data-bg]").forEach(el => {
      const u = safeImg(el.dataset.bg);
      if(u) el.style.backgroundImage = cssUrl(u);
    });
  }

  // ---------- icon set ----------
  const ICONS = {
    facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.4h2.8l.4-3.3h-3.2V8.2c0-.95.27-1.6 1.63-1.6h1.74V3.7C15.97 3.6 15 3.5 13.9 3.5c-2.9 0-4.9 1.77-4.9 5v2.8H6.2v3.3H9v8.4h4.5Z"/></svg>`,
    instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.1" cy="6.9" r="1.1" fill="currentColor" stroke="none"/></svg>`,
    tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3h2.7c.2 1.9 1.6 3.4 3.5 3.7v2.8c-1.3 0-2.5-.4-3.5-1.1v6.4c0 3-2.4 5.4-5.4 5.4S6.4 17.8 6.4 14.8c0-2.9 2.3-5.3 5.2-5.4v2.9c-1.3.1-2.4 1.2-2.4 2.5 0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5V3Z"/></svg>`,
    youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.8c-.2-1.2-1.1-2.1-2.3-2.3C17.4 5.2 12 5.2 12 5.2s-5.4 0-7.3.3C3.5 5.7 2.6 6.6 2.4 7.8 2.1 9.7 2.1 12 2.1 12s0 2.3.3 4.2c.2 1.2 1.1 2.1 2.3 2.3 1.9.3 7.3.3 7.3.3s5.4 0 7.3-.3c1.2-.2 2.1-1.1 2.3-2.3.3-1.9.3-4.2.3-4.2s0-2.3-.3-4.2ZM10 15.2V8.8l5.5 3.2-5.5 3.2Z"/></svg>`,
    telegram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 4.4 2.9 11.7c-.9.35-.9.98-.15 1.24l4.6 1.44 1.78 5.5c.22.6.56.6.87.36l2.5-2.3 4.55 3.36c.5.32 1.02.13 1.18-.5l3.47-16.1c.25-.94-.35-1.35-1.05-1.06Zm-3.2 3.2-8.1 7.35-.32 3.1-1.6-4.95 9.66-6.13c.35-.2.65.05.36.63Z"/></svg>`,
    whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.8-.9-2.1-1-.3-.1-.5-.15-.7.15-.2.3-.8 1-.95 1.2-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.4-1.47-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.6.14-.14.3-.35.45-.53.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.7-1.68-.96-2.3-.25-.6-.5-.5-.7-.5h-.6c-.2 0-.53.07-.8.37-.28.3-1.05 1.02-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.13 3.25 5.15 4.55.72.31 1.28.5 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.8-.73 2.05-1.44.25-.7.25-1.3.17-1.44-.07-.13-.27-.2-.57-.35ZM12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.15L2 22l4.98-1.44A9.96 9.96 0 0 0 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2Z"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 7.5 12.4 6a3.5 3.5 0 1 1 5 5l-1.5 1.4"/><path d="M13 16.5 11.6 18a3.5 3.5 0 1 1-5-5l1.5-1.4"/></svg>`
  };
  const iconFor = key => ICONS[(key||"").toLowerCase()] || ICONS.link;

  const PLATFORM_NAMES = {
    facebook:"Facebook", instagram:"Instagram", tiktok:"TikTok", youtube:"YouTube",
    telegram:"Telegram", whatsapp:"WhatsApp", custom:"Link"
  };
  // older entries stored the raw platform key as the label ("facebook"); show a proper name
  function socialLabel(l){
    const raw = (l.label || "").trim();
    const key = (raw || l.platform || "").toLowerCase();
    if(!raw || raw.toLowerCase() === (l.platform || "").toLowerCase()) return PLATFORM_NAMES[key] || raw || "Link";
    return raw;
  }

  // icons for the "More links" cards, one per link type
  const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const TYPE_ICONS = {
    link:     S(`<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/>`),
    download: S(`<path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>`),
    video:    S(`<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5Z" fill="currentColor"/>`),
    music:    S(`<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>`),
    file:     S(`<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>`),
    shop:     S(`<path d="M5 8h14l-1 12H6Z"/><path d="M9 8a3 3 0 0 1 6 0"/>`),
    contact:  S(`<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>`)
  };
  const dlIcon = TYPE_ICONS.download;
  const openIcon = S(`<path d="M7 17 17 7"/><path d="M8 7h9v9"/>`);

  const initials = name => (name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("") || "?";

  // older entries had no "type": guess it from version / file extension
  function resolveType(a){
    if(a.type && TYPE_ICONS[a.type]) return a.type;
    if(a.version || /\.(apk|zip|exe|dmg|ipa|aab)(\?|#|$)/i.test(a.downloadUrl || "")) return "download";
    return "link";
  }

  function renderPremiumName(el, name){
    el.innerHTML = "";
    el.classList.add("name-premium");
    Array.from(name).forEach((ch, i) => {
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.style.setProperty("--i", i);
      letter.textContent = ch === " " ? "\u00A0" : ch;
      if(ch !== " "){
        const dustCount = 5;
        for(let d = 0; d < dustCount; d++){
          const dot = document.createElement("i");
          dot.className = "dust";
          const angle = Math.random() * Math.PI * 2;
          const dist = 16 + Math.random() * 26;
          const dx = (Math.cos(angle) * dist).toFixed(1) + "px";
          const dy = (Math.sin(angle) * dist).toFixed(1) + "px";
          dot.style.setProperty("--dx", dx);
          dot.style.setProperty("--dy", dy);
          dot.style.setProperty("--dd", (0.55 + Math.random() * 0.35).toFixed(2) + "s");
          dot.style.setProperty("--dl", (Math.random() * 0.12).toFixed(2) + "s");
          dot.style.setProperty("--i", i);
          letter.appendChild(dot);
        }
      }
      el.appendChild(letter);
    });
  }

  async function loadProfile(){
    try{
      const snap = await getDoc(doc(db, "profile", "main"));
      const p = snap.exists() ? snap.data() : {};
      document.title = p.name || "Profile";
      renderPremiumName(document.getElementById("name"), p.name || "Your Name");
      document.getElementById("bio").textContent = p.bio || "";
      const avatar = document.getElementById("avatar");
      const av = safeImg(p.avatarUrl);
      if(av){
        avatar.style.backgroundImage = cssUrl(av);
        avatar.textContent = "";
      } else {
        avatar.textContent = initials(p.name);
      }
      applyAppearance(p);
    }catch(e){
      document.getElementById("name").textContent = "Your Name";
      console.error(e);
    }
  }

  const HEX = /^#[0-9a-f]{6}$/i;
  function applyAppearance(p){
    const root = document.documentElement.style;
    if(Array.isArray(p.gradientColors) && p.gradientColors.length >= 2){
      if(HEX.test(p.gradientColors[0])) root.setProperty("--accent-a", p.gradientColors[0]);
      if(HEX.test(p.gradientColors[1])) root.setProperty("--accent-b", p.gradientColors[1]);
      if(p.gradientColors[2] && HEX.test(p.gradientColors[2])) root.setProperty("--accent-c", p.gradientColors[2]);
    }
    if(HEX.test(p.socialColor || "")) root.setProperty("--social", p.socialColor);
    const bd = document.querySelector(".backdrop");
    const bg = safeImg(p.bgImageUrl);
    if(p.backgroundType === "image" && bg){
      bd.style.backgroundImage = `linear-gradient(rgba(227,232,240,.78),rgba(227,232,240,.9)), ${cssUrl(bg)}`;
      bd.style.backgroundSize = "cover";
      bd.style.backgroundPosition = "center";
    }
  }

  async function loadLinks(){
    const grid = document.getElementById("socialGrid");
    try{
      const q = query(collection(db, "links"), orderBy("order", "asc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach(d => { const v = d.data(); if(v.enabled !== false) items.push(v); });
      grid.innerHTML = items.map((l, idx) => {
        const href = safeUrl(l.url);
        const icon = safeImg(l.iconUrl);
        return `
        <a class="social-btn" style="--i-delay:${(idx*0.07).toFixed(2)}s" href="${escAttr(href)}" ${isWeb(href) ? 'target="_blank" rel="noopener noreferrer"' : ""}>
          <span class="social-icon">${icon ? `<img src="${escAttr(icon)}" alt="" style="width:100%;height:100%;border-radius:13px;object-fit:cover;">` : iconFor(l.platform)}</span>
          <span class="social-label">${escHtml(socialLabel(l))}</span>
          <svg class="social-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>`;
      }).join("");
    }catch(e){ console.error(e); }
  }

  // "More links" (stored in the existing "apps" collection so old data keeps working)
  async function loadMore(){
    const wrap = document.getElementById("appsGrid");
    const btn = document.getElementById("appStoreBtn");
    try{
      const q = query(collection(db, "apps"), orderBy("order", "asc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach(d => { const v = d.data(); if(v.enabled !== false) items.push(v); });

      if(items.length === 0){ return; }

      btn.style.display = "inline-flex";
      requestAnimationFrame(() => btn.classList.add("show"));

      wrap.innerHTML = items.map((a, idx) => {
        const type = resolveType(a);
        const href = safeUrl(a.downloadUrl);
        const icon = safeImg(a.iconUrl);
        const shot = safeImg(a.screenshotUrl);
        const badge = a.version ? (/^\d/.test(String(a.version).trim()) ? "v" + a.version : a.version) : "";
        const btnText = (a.buttonText || "").trim() || (type === "download" ? "Download" : "Open");
        const btnIcon = type === "download" ? dlIcon : openIcon;
        return `
        <div class="app-card" style="--i-delay:${(idx*0.09).toFixed(2)}s">
          <div class="app-top">
            <div class="app-icon" ${icon ? `data-bg="${escAttr(icon)}"` : ""}>${icon ? "" : TYPE_ICONS[type]}</div>
            <div class="app-info">
              <div class="app-name-row">
                <p class="app-name">${escHtml(a.name || "Link")}</p>
                ${badge ? `<span class="app-version">${escHtml(badge)}</span>` : ""}
              </div>
              ${a.description ? `<p class="app-desc">${escHtml(a.description)}</p>` : ""}
            </div>
          </div>
          ${shot ? `<img class="app-shot" src="${escAttr(shot)}" alt="${escAttr((a.name||'Link') + ' preview')}">` : ""}
          <div class="app-actions">
            <a class="dl-btn" href="${escAttr(href)}" ${isWeb(href) ? 'target="_blank" rel="noopener noreferrer"' : ""}>${btnIcon} ${escHtml(btnText)}</a>
          </div>
        </div>`;
      }).join("");
      applyBgImages(wrap);
    }catch(e){
      wrap.innerHTML = `<div class="empty">More links will appear here.</div>`;
      console.error(e);
    }
  }

  // ---------- tap ripple ----------
  document.addEventListener("pointerdown", e => {
    const t = e.target.closest(".social-btn, .dl-btn");
    if(!t || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = t.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.width = dot.style.height = size + "px";
    dot.style.left = (e.clientX - r.left - size / 2) + "px";
    dot.style.top = (e.clientY - r.top - size / 2) + "px";
    t.appendChild(dot);
    dot.addEventListener("animationend", () => dot.remove());
  });

  // ---------- More toggle ----------
  document.getElementById("appStoreBtn").addEventListener("click", () => {
    const btn = document.getElementById("appStoreBtn");
    const label = btn.querySelector(".app-store-label");
    const socialGrid = document.getElementById("socialGrid");
    const appsSection = document.getElementById("appsSection");
    const opening = !btn.classList.contains("open");
    btn.setAttribute("aria-expanded", String(opening));

    if(opening){
      btn.classList.add("open");
      label.textContent = "Back to Links";
      socialGrid.classList.remove("swap-in");
      socialGrid.classList.add("swap-out");
      setTimeout(() => {
        socialGrid.style.display = "none";
        appsSection.style.display = "block";
        appsSection.classList.remove("swap-out");
        void appsSection.offsetWidth;
        appsSection.classList.add("swap-in");
      }, 280);
    } else {
      btn.classList.remove("open");
      label.textContent = "More";
      appsSection.classList.remove("swap-in");
      appsSection.classList.add("swap-out");
      setTimeout(() => {
        appsSection.style.display = "none";
        appsSection.classList.remove("swap-out");
        socialGrid.style.display = "flex";
        socialGrid.classList.remove("swap-out");
        void socialGrid.offsetWidth;
        socialGrid.classList.add("swap-in");
      }, 280);
    }
  });

  loadProfile();
  loadLinks();
  loadMore();
</script>
</body>
</html>
